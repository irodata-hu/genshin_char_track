<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Character Image & Debug Extractor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0e0e12;
      color: #e0e0e0;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      max-width: 1200px;
      width: 100%;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
      justify-content: center;
    }

    input, button {
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    input {
      width: 280px;
      background-color: #1e1e28;
      color: #fff;
      border: 1px solid #333345;
    }

    button {
      background-color: #4c6ef5;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #3b5bdb;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Gallery - Images Only */
    .gallery-section {
      background-color: #161620;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 1rem;
    }

    .gallery-title {
      color: #74c0fc;
      font-weight: bold;
      margin-top: 0;
      margin-bottom: 1rem;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .img-card {
      background-color: #0e0e12;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Full Resolution & Uncropped */
    .img-card img {
      max-width: 100%;
      max-height: 75vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      display: block;
    }

    /* Debug Panel */
    .debug-panel {
      background-color: #161620;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.85rem;
      overflow: hidden;
    }

    .debug-title {
      color: #ffd43b;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .status-box {
      padding: 0.6rem;
      border-radius: 6px;
      background: #20202d;
      margin-bottom: 1rem;
      color: #74c0fc;
      word-break: break-all;
    }

    .extraction-steps {
      color: #b197fc;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    pre {
      background-color: #0d0d12;
      padding: 0.8rem;
      border-radius: 6px;
      max-height: 350px;
      overflow-y: auto;
      color: #a6e22e;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid #2a2a3a;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 style="text-align: center; margin-bottom: 1.5rem;">Genshin Image & Debug Extractor</h1>

    <div class="search-box">
      <input type="text" id="characterInput" placeholder="e.g. furina, raiden, hutao" value="furina">
      <button id="searchBtn">Search</button>
    </div>

    <div class="main-layout">
      <!-- Image Gallery (Only Images) -->
      <div class="gallery-section">
        <div class="gallery-title">📷 High-Res Artwork Gallery</div>
        <div class="gallery" id="gallery">
          <div style="color: #888;">Images will appear here...</div>
        </div>
      </div>

      <!-- Debug & Logic Extraction Panel -->
      <div class="debug-panel">
        <div class="debug-title">🔍 API Request Status</div>
        <div class="status-box" id="statusBox">Ready to fetch.</div>

        <div class="debug-title">⚙️ Data Extraction Logic</div>
        <div class="extraction-steps" id="extractionSteps">Waiting for query...</div>

        <div class="debug-title">📦 Raw JSON Response</div>
        <pre id="jsonOutput">// Raw JSON response will appear here</pre>
      </div>
    </div>
  </div>

  <script>
    const searchBtn = document.getElementById('searchBtn');
    const characterInput = document.getElementById('characterInput');
    const gallery = document.getElementById('gallery');
    const statusBox = document.getElementById('statusBox');
    const extractionSteps = document.getElementById('extractionSteps');
    const jsonOutput = document.getElementById('jsonOutput');

    // Slug formatting & alias handling to prevent "character not found" errors
    function formatSlug(input) {
      const clean = input.toLowerCase().trim();
      const aliases = {
        'furina': 'furina',
        'raiden': 'raiden',
        'raiden shogun': 'raiden',
        'hu tao': 'hu-tao',
        'hutao': 'hu-tao',
        'yae': 'yae-miko',
        'yae miko': 'yae-miko',
        'ayaka': 'ayaka',
        'kamisato ayaka': 'ayaka',
        'ayato': 'ayato',
        'kamisato ayato': 'ayato',
        'kazuha': 'kazuha',
        'kaedehara kazuha': 'kazuha',
        'yelan': 'yelan',
        'zhongli': 'zhongli',
        'nahida': 'nahida',
        'neuvillette': 'neuvillette',
        'alhaitham': 'alhaitham',
        'navia': 'navia',
        'arlecchino': 'arlecchino'
      };
      return aliases[clean] || clean.replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
    }

    async function fetchCharacterData() {
      const rawInput = characterInput.value.trim() || 'furina';
      const charSlug = formatSlug(rawInput);
      const apiUrl = `https://genshin.jmp.blue/characters/${charSlug}`;

      statusBox.style.color = '#74c0fc';
      statusBox.innerText = `[GET] Fetching: ${apiUrl}`;
      gallery.innerHTML = '';

      try {
        const response = await fetch(apiUrl);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: Character "${charSlug}" not found on server.`);
        }

        const data = await response.json();

        // Target high-resolution asset endpoints
        const imageCandidates = [
          { label: 'Gacha Splash (Full Art)', url: `https://genshin.jmp.blue/characters/${charSlug}/gacha-splash` },
          { label: 'Gacha Card', url: `https://genshin.jmp.blue/characters/${charSlug}/gacha-card` },
          { label: 'Portrait', url: `https://genshin.jmp.blue/characters/${charSlug}/portrait` },
          { label: 'Card', url: `https://genshin.jmp.blue/characters/${charSlug}/card` },
          { label: 'Icon', url: `https://genshin.jmp.blue/characters/${charSlug}/icon` }
        ];

        let loadedImages = 0;
        let stepLogs = [];

        imageCandidates.forEach(item => {
          const card = document.createElement('div');
          card.className = 'img-card';

          const img = document.createElement('img');
          img.setAttribute('referrerpolicy', 'no-referrer');
          img.src = item.url;
          img.alt = data.name;

          img.onload = () => {
            card.appendChild(img);
            gallery.appendChild(card);
            loadedImages++;
            updateExtractionSteps(charSlug, data, imageCandidates, loadedImages);
          };

          img.onerror = () => {
            // Hide missing endpoints cleanly
            card.remove();
          };
        });

        // Display Raw JSON
        jsonOutput.innerText = JSON.stringify(data, null, 2);

        statusBox.style.color = '#51cf66';
        statusBox.innerText = `✅ Successfully retrieved data & images for "${data.name}"!`;

        updateExtractionSteps(charSlug, data, imageCandidates, loadedImages);

      } catch (err) {
        statusBox.style.color = '#ff6b6b';
        statusBox.innerText = `❌ ${err.message}`;
        extractionSteps.innerHTML = `<span style="color:#ff6b6b">Extraction failed for search: "${rawInput}" (Slug: "${charSlug}")</span>`;
        jsonOutput.innerText = `{\n  "error": "${err.message}"\n}`;
        gallery.innerHTML = `<div style="color:#ff6b6b; padding:1rem;">No images loaded.</div>`;
      }
    }

    function updateExtractionSteps(slug, data, candidates, loadedCount) {
      extractionSteps.innerHTML = `
        1. <b>Input Query:</b> "${characterInput.value.trim()}" ➔ Slug: "<b>${slug}</b>"<br>
        2. <b>API Endpoint:</b> GET https://genshin.jmp.blue/characters/${slug}<br>
        3. <b>Extracted Name:</b> ${data.name || 'N/A'}<br>
        4. <b>Extracted Vision/Element:</b> ${data.vision || 'N/A'}<br>
        5. <b>Image Endpoints Queried:</b> ${candidates.length}<br>
        6. <b>Valid Images Loaded:</b> ${loadedCount} active images rendered cleanly without cropping.
      `;
    }

    searchBtn.addEventListener('click', fetchCharacterData);
    characterInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') fetchCharacterData();
    });

    window.addEventListener('DOMContentLoaded', fetchCharacterData);
  </script>
</body>
</html>
