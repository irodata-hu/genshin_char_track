<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Character Profile</title>
  <style>
    body { font-family: sans-serif; background: #1a1a24; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
    .card { background: #2b2b3a; border-radius: 12px; padding: 1.5rem; text-align: center; max-width: 350px; display: none; }
    .card img { width: 100%; height: 300px; object-fit: cover; border-radius: 8px; margin-bottom: 1rem; }
    input { padding: 0.8rem; width: 200px; border-radius: 6px; border: none; }
    button { padding: 0.8rem; cursor: pointer; background: #4c6ef5; color: white; border: none; border-radius: 6px; }
    .badge { display: inline-block; padding: 0.3rem 0.8rem; background: #3e3e55; border-radius: 20px; margin: 0.2rem; }
  </style>

  <!-- Load the library -->
  <script src="https://cdn.jsdelivr.net/npm/genshin-db@latest/dist/genshin-db.js"></script>
</head>
<body>

  <h1>Genshin Profile Finder</h1>
  <div style="margin-bottom: 2rem;">
    <input type="text" id="characterInput" placeholder="Enter name (e.g. Furina)">
    <button onclick="getCharacterData()">Search</button>
  </div>

  <div class="card" id="profileCard">
    <img id="charImage" src="" alt="Character">
    <h2 id="charName"></h2>
    <div>
      <span class="badge" id="charRarity"></span>
      <span class="badge" id="charElement"></span>
      <span class="badge" id="charWeapon"></span>
    </div>
  </div>

  <script>
    // FIX: Set default language so the library knows how to search
    genshinDb.setDefaultOptions({ language: 'English', resultLanguage: 'English' });

    function getCharacterData() {
      const input = document.getElementById('characterInput').value.trim() || 'Furina';
      const card = document.getElementById('profileCard');
      
      // Use the library's search function
      const character = genshinDb.characters(input);

      if (!character) {
        alert('Character not found! Check spelling.');
        return;
      }

      // Update UI
      document.getElementById('charName').innerText = character.name;
      document.getElementById('charRarity').innerText = '★'.repeat(character.rarity);
      document.getElementById('charElement').innerText = character.element;
      document.getElementById('charWeapon').innerText = character.weaponType;
      
      // Update Image (Safely handle nested objects)
      const imgUrl = character.images?.cover1 || character.images?.icon;
      document.getElementById('charImage').src = imgUrl || '';

      card.style.display = 'block';
    }
  </script>
</body>
</html>
