<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Genshin Debugger</title>
  <style>
    body { font-family: sans-serif; background: #1a1a24; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
    .card { background: #2b2b3a; border-radius: 12px; padding: 1.5rem; text-align: center; max-width: 350px; display: none; margin-top: 20px; }
    .card img { width: 100%; height: 300px; object-fit: cover; border-radius: 8px; margin-bottom: 1rem; background: #000; }
    #debug { color: #ffd43b; font-size: 0.8rem; margin-top: 10px; max-width: 400px; word-break: break-all; }
  </style>

  <!-- Load library -->
  <script src="https://cdn.jsdelivr.net/npm/genshin-db@latest/dist/index.js"></script>
</head>
<body>

  <h1>Genshin Profile Finder</h1>
  <div>
    <input type="text" id="characterInput" placeholder="e.g. Furina" value="Furina">
    <button onclick="handleSearch()">Search</button>
  </div>
  
  <div id="debug"></div>

  <div class="card" id="profileCard">
    <img id="charImage" src="" alt="Character">
    <h2 id="charName"></h2>
    <p id="charDetails"></p>
  </div>

  <script>
    // Access the library globally
    const db = window.genshinDb;

    function handleSearch() {
      const debug = document.getElementById('debug');
      const input = document.getElementById('characterInput').value.trim();
      const card = document.getElementById('profileCard');
      
      debug.innerText = "Searching for: " + input + "...";

      try {
        // Perform search
        const result = db.characters(input);

        if (!result) {
          debug.innerText = "Result: null. Try a different name.";
          card.style.display = 'none';
          return;
        }

        console.log("Full Data Object:", result);
        debug.innerText = "Success! Found: " + result.name;

        // UI Update
        document.getElementById('charName').innerText = result.name;
        document.getElementById('charDetails').innerText = `${result.rarity}★ ${result.element} ${result.weaponType}`;
        
        // Use the official HoYoLab image URL provided by the DB
        const img = result.images.cover1 || result.images.icon;
        document.getElementById('charImage').src = img;
        
        card.style.display = 'block';
      } catch (err) {
        debug.innerText = "Error: " + err.message;
        console.error(err);
      }
    }
  </script>
</body>
</html>
