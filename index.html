<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Profile Icons & Debug Extractor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0e0e12;
      color: #e0e0e0;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      max-width: 1250px;
      width: 100%;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
      justify-content: center;
    }

    input, button {
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    input {
      width: 280px;
      background-color: #1e1e28;
      color: #fff;
      border: 1px solid #333345;
    }

    button {
      background-color: #4c6ef5;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #3b5bdb;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    .gallery-section, .debug-panel {
      background-color: #161620;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 1rem;
    }

    .section-title {
      color: #74c0fc;
      font-weight: bold;
      margin-top: 0;
      margin-bottom: 1rem;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      align-items: flex-start;
    }

    .img-card {
      background-color: #0e0e12;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      max-width: 100%;
    }

    .img-card img {
      max-width: 150px;
      max-height: 150px;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      display: block;
    }

    .info-box {
      margin-top: 10px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .source-label {
      font-size: 0.75rem;
      color: #a0a0b0;
      background-color: #161620;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #2a2a3a;
      text-align: center;
    }

    .api-link {
      font-size: 0.7rem;
      color: #74c0fc;
      text-decoration: none;
      background-color: #161620;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #2a2a3a;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
    }

    .api-link:hover {
      color: #a5d8ff;
      border-color: #4c6ef5;
    }

    .debug-panel {
      font-family: monospace;
      font-size: 0.85rem;
    }

    .debug-title {
      color: #ffd43b;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .status-box {
      padding: 0.6rem;
      border-radius: 6px;
      background: #0e0e12;
      margin-bottom: 1rem;
      color: #74c0fc;
      word-break: break-all;
    }

    .extraction-steps {
      color: #b197fc;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    pre {
      background-color: #0e0e12;
      padding: 0.8rem;
      border-radius: 6px;
      max-height: 350px;
      overflow-y: auto;
      color: #a6e22e;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid #2a2a3a;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 style="text-align: center; margin-bottom: 1.5rem;">Genshin Icons & Debug Extractor</h1>

    <div class="search-box">
      <input type="text" id="characterInput" placeholder="Enter character (e.g. Furina, Raiden)" value="Furina">
      <button id="searchBtn">Search</button>
    </div>

    <div class="main-layout">
      <!-- Image Gallery -->
      <div class="gallery-section">
        <div class="section-title">🖼️ Profile & Side Icons Gallery</div>
        <div class="gallery" id="gallery">
          <div style="color: #888;">Icons will appear here...</div>
        </div>
      </div>

      <!-- Debug Panel -->
      <div class="debug-panel">
        <div class="debug-title">🔍 API Request Status</div>
        <div class="status-box" id="statusBox">Ready to fetch...</div>

        <div class="debug-title">⚙️ Dynamic Extraction Steps</div>
        <div class="extraction-steps" id="extractionSteps">Waiting for query...</div>

        <div class="debug-title">📦 Raw JSON Data</div>
        <pre id="jsonOutput">// Dynamic response data will appear here</pre>
      </div>
    </div>
  </div>

  <script>
    const searchBtn = document.getElementById('searchBtn');
    const characterInput = document.getElementById('characterInput');
    const gallery = document.getElementById('gallery');
    const statusBox = document.getElementById('statusBox');
    const extractionSteps = document.getElementById('extractionSteps');
    const jsonOutput = document.getElementById('jsonOutput');

    function cleanUrl(url) {
      if (!url || typeof url !== 'string') return null;
      return url.replace(/\/revision\/latest\/scale-to-width-down\/\d+/, '/revision/latest');
    }

    async function loadIcons() {
      const rawQuery = characterInput.value.trim() || 'Furina';
      const slug = rawQuery.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');

      statusBox.style.color = '#74c0fc';
      statusBox.innerText = `[SEARCH] Resolving icons for dynamic slug "${slug}"...`;
      gallery.innerHTML = '';

      let characterData = null;
      const imageQueue = [];

      // 1. Target genshin.jmp.blue Icons ONLY
      imageQueue.push(
        { url: `https://genshin.jmp.blue/characters/${slug}/icon`, source: 'genshin.jmp.blue (Profile Icon)' },
        { url: `https://genshin.jmp.blue/characters/${slug}/icon-side`, source: 'genshin.jmp.blue (Side Icon)' }
      );

      // 2. Dynamic fetch from genshin-db raw data via jsDelivr CDN
      try {
        const res = await fetch(`https://fastly.jsdelivr.net/gh/theBowja/genshin-db@main/src/data/english/characters/${slug}.json`);
        if (res.ok) {
          characterData = await res.json();
          const imgObj = characterData.images || {};

          const dbEndpoints = [
            { raw: imgObj.icon, source: 'genshin-db CDN (Profile Icon)' },
            { raw: imgObj.sideicon, source: 'genshin-db CDN (Side Icon)' },
            { raw: imgObj['hoyolab-avatar-icon'], source: 'genshin-db CDN (HoYoLab Icon)' }
          ];

          dbEndpoints.forEach(item => {
            const sanitized = cleanUrl(item.raw);
            if (sanitized) {
              imageQueue.push({ url: sanitized, source: item.source });
            }
          });
        }
      } catch (err) {
        console.warn('CDN dataset fetch skipped:', err);
      }

      // 3. Fallback fetch to genshin.jmp.blue JSON metadata if CDN didn't return data
      if (!characterData) {
        try {
          const res = await fetch(`https://genshin.jmp.blue/characters/${slug}`);
          if (res.ok) {
            characterData = await res.json();
          }
        } catch (e) {}
      }

      // Deduplicate targets
      const uniqueQueue = imageQueue.filter((item, index, self) =>
        index === self.findIndex((t) => t.url === item.url)
      );

      jsonOutput.innerText = characterData ? JSON.stringify(characterData, null, 2) : '// No JSON payload available';

      let loadedCount = 0;

      uniqueQueue.forEach(item => {
        const card = document.createElement('div');
        card.className = 'img-card';

        const img = document.createElement('img');
        img.referrerPolicy = 'no-referrer';
        img.src = item.url;
        img.alt = rawQuery;

        const infoBox = document.createElement('div');
        infoBox.className = 'info-box';

        const sourceTag = document.createElement('div');
        sourceTag.className = 'source-label';
        sourceTag.innerText = item.source;

        const apiLink = document.createElement('a');
        apiLink.className = 'api-link';
        apiLink.href = item.url;
        apiLink.target = '_blank';
        apiLink.rel = 'noopener noreferrer';
        apiLink.title = item.url;
        apiLink.innerText = item.url;

        infoBox.appendChild(sourceTag);
        infoBox.appendChild(apiLink);

        img.onload = () => {
          card.appendChild(img);
          card.appendChild(infoBox);
          gallery.appendChild(card);
          loadedCount++;
          updateDebugInfo(rawQuery, slug, uniqueQueue.length, loadedCount);
        };

        img.onerror = () => {
          card.remove();
        };
      });

      statusBox.style.color = '#51cf66';
      statusBox.innerText = `✅ Processed icons for query "${rawQuery}" (Slug: ${slug})`;
      updateDebugInfo(rawQuery, slug, uniqueQueue.length, loadedCount);
    }

    function updateDebugInfo(query, slug, tested, loaded) {
      extractionSteps.innerHTML = `
        1. <b>User Search:</b> "${query}"<br>
        2. <b>Dynamic Slug:</b> <code>${slug}</code><br>
        3. <b>Targeted Endpoints:</b> ${tested} (Profile & Side Icons Only)<br>
        4. <b>Successfully Rendered:</b> ${loaded}
      `;
    }

    searchBtn.addEventListener('click', loadIcons);
    characterInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadIcons();
    });

    window.addEventListener('DOMContentLoaded', loadIcons);
  </script>
</body>
</html>
