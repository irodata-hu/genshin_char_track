<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Character High-Res Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0e0e12;
      color: #ffffff;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
    }

    input, button {
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    input {
      width: 280px;
      background-color: #1e1e28;
      color: #fff;
      border: 1px solid #333345;
    }

    button {
      background-color: #4c6ef5;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #3b5bdb;
    }

    #status {
      margin-bottom: 1rem;
      color: #ff6b6b;
      font-weight: bold;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 1400px;
    }

    .img-card {
      background-color: #161620;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Fixed Aspect Ratio & No Cropping */
    .img-card img {
      max-width: 100%;
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      display: block;
      image-rendering: -webkit-optimize-contrast;
    }
  </style>
</head>
<body>

  <div class="search-box">
    <input type="text" id="characterInput" placeholder="Enter character name (e.g. Furina, Raiden)" value="Furina">
    <button id="searchBtn">Search</button>
  </div>

  <div id="status"></div>

  <div class="gallery" id="gallery"></div>

  <script type="module">
    // ES Module load natively supported on GitHub Pages (https://)
    import genshinDb from 'https://cdn.jsdelivr.net/npm/genshin-db@latest/+esm';

    genshinDb.setDefaultOptions({ language: 'English', resultLanguage: 'English' });

    const searchBtn = document.getElementById('searchBtn');
    const characterInput = document.getElementById('characterInput');
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');

    function loadFullResImages() {
      const query = characterInput.value.trim() || 'Furina';
      status.innerText = '';
      gallery.innerHTML = '';

      const character = genshinDb.characters(query);

      if (!character) {
        status.innerText = `Character "${query}" not found. Check spelling.`;
        return;
      }

      const imageObj = character.images || {};
      
      // Extract unique original high-res image URLs
      const imageUrls = [
        imageObj.cover1,
        imageObj.cover2,
        imageObj.icon,
        imageObj.sideicon,
        imageObj.hoyolab-avatar
      ].filter((url, index, self) => url && typeof url === 'string' && self.indexOf(url) === index);

      if (imageUrls.length === 0) {
        status.innerText = 'No image links available for this character.';
        return;
      }

      imageUrls.forEach(url => {
        const card = document.createElement('div');
        card.className = 'img-card';

        const img = document.createElement('img');
        // Crucial: Bypass CDN hotlink compression / 403 blocks on GitHub Pages
        img.setAttribute('referrerpolicy', 'no-referrer');
        img.src = url;
        img.alt = character.name;

        img.onload = () => {
          card.appendChild(img);
          gallery.appendChild(card);
        };
      });
    }

    searchBtn.addEventListener('click', loadFullResImages);
    characterInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadFullResImages();
    });

    window.addEventListener('DOMContentLoaded', loadFullResImages);
  </script>
</body>
</html>
