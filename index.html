<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Character Gallery with Links</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0e0e12;
      color: #ffffff;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
    }

    input, button {
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    input {
      width: 280px;
      background-color: #1e1e28;
      color: #fff;
      border: 1px solid #333345;
    }

    button {
      background-color: #4c6ef5;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #3b5bdb;
    }

    #status {
      margin-bottom: 1rem;
      color: #ff6b6b;
      font-weight: bold;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 1400px;
    }

    .img-card {
      background-color: #161620;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 100%;
      box-sizing: border-box;
    }

    /* Uncropped image display */
    .img-card img {
      max-width: 100%;
      max-height: 75vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      display: block;
    }

    .info-box {
      margin-top: 12px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .source-label {
      font-size: 0.8rem;
      color: #a0a0b0;
      background-color: #0e0e12;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #2a2a3a;
      text-align: center;
      word-break: break-word;
    }

    .api-link {
      font-size: 0.75rem;
      color: #74c0fc;
      text-decoration: none;
      background-color: #0e0e12;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #2a2a3a;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
    }

    .api-link:hover {
      text-decoration: underline;
      color: #a5d8ff;
      border-color: #4c6ef5;
    }
  </style>
</head>
<body>

  <div class="search-box">
    <input type="text" id="characterInput" placeholder="e.g. furina, raiden, hutao" value="furina">
    <button id="searchBtn">Search</button>
  </div>

  <div id="status"></div>
  <div class="gallery" id="gallery"></div>

  <script>
    const searchBtn = document.getElementById('searchBtn');
    const characterInput = document.getElementById('characterInput');
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');

    function getSlug(input) {
      const clean = input.toLowerCase().trim();
      const aliases = {
        'furina': 'furina',
        'raiden': 'raiden',
        'raiden shogun': 'raiden',
        'hu tao': 'hu-tao',
        'hutao': 'hu-tao',
        'yae': 'yae-miko',
        'yae miko': 'yae-miko',
        'ayaka': 'ayaka',
        'kamisato ayaka': 'ayaka',
        'ayato': 'ayato',
        'kamisato ayato': 'ayato',
        'kazuha': 'kazuha',
        'kaedehara kazuha': 'kazuha',
        'yelan': 'yelan',
        'zhongli': 'zhongli',
        'nahida': 'nahida',
        'neuvillette': 'neuvillette',
        'alhaitham': 'alhaitham',
        'navia': 'navia',
        'arlecchino': 'arlecchino'
      };
      return aliases[clean] || clean.replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
    }

    // Strips Wikia/CDN downscaling query parameters to return full resolution
    function sanitizeUrl(url) {
      if (!url || typeof url !== 'string') return null;
      return url.replace(/\/revision\/latest\/scale-to-width-down\/\d+/, '/revision/latest');
    }

    async function fetchAllImages() {
      const rawInput = characterInput.value.trim() || 'furina';
      const slug = getSlug(rawInput);

      status.innerText = '';
      gallery.innerHTML = '';

      const imageQueue = [];

      // API Source 1: genshin.jmp.blue
      const jmpCandidates = [
        { url: `https://genshin.jmp.blue/characters/${slug}/gacha-splash`, source: 'genshin.jmp.blue (Gacha Splash)' },
        { url: `https://genshin.jmp.blue/characters/${slug}/gacha-card`, source: 'genshin.jmp.blue (Gacha Card)' },
        { url: `https://genshin.jmp.blue/characters/${slug}/portrait`, source: 'genshin.jmp.blue (Portrait)' },
        { url: `https://genshin.jmp.blue/characters/${slug}/card`, source: 'genshin.jmp.blue (Card)' },
        { url: `https://genshin.jmp.blue/characters/${slug}/icon`, source: 'genshin.jmp.blue (Icon Profile)' },
        { url: `https://genshin.jmp.blue/characters/${slug}/icon-big`, source: 'genshin.jmp.blue (Big Icon)' },
        { url: `https://genshin.jmp.blue/characters/${slug}/icon-side`, source: 'genshin.jmp.blue (Side Icon)' }
      ];
      imageQueue.push(...jmpCandidates);

      // API Source 2: genshin-db Repository CDN
      try {
        const res = await fetch(`https://fastly.jsdelivr.net/gh/theBowja/genshin-db@main/src/data/english/characters/${slug}.json`);
        if (res.ok) {
          const dbData = await res.json();
          const imgObj = dbData.images || {};

          const dbCandidates = [
            { raw: imgObj.cover1, name: 'genshin-db CDN (Cover Art 1)' },
            { raw: imgObj.cover2, name: 'genshin-db CDN (Cover Art 2)' },
            { raw: imgObj.icon, name: 'genshin-db CDN (Profile Icon)' },
            { raw: imgObj.sideicon, name: 'genshin-db CDN (Side Icon)' },
            { raw: imgObj['hoyolab-avatar'], name: 'genshin-db CDN (HoYoLab Avatar)' },
            { raw: imgObj['hoyolab-avatar-icon'], name: 'genshin-db CDN (HoYoLab Icon)' },
            { raw: imgObj['hoyolab-card'], name: 'genshin-db CDN (HoYoLab Card)' }
          ];

          dbCandidates.forEach(item => {
            const clean = sanitizeUrl(item.raw);
            if (clean) {
              imageQueue.push({ url: clean, source: item.name });
            }
          });
        }
      } catch (e) {
        console.warn('genshin-db fetch skipped:', e);
      }

      // Deduplicate URLs
      const uniqueQueue = imageQueue.filter((item, index, self) =>
        index === self.findIndex((t) => t.url === item.url)
      );

      let loadedCount = 0;

      uniqueQueue.forEach(item => {
        const card = document.createElement('div');
        card.className = 'img-card';

        const img = document.createElement('img');
        img.referrerPolicy = 'no-referrer';
        img.src = item.url;
        img.alt = rawInput;

        const infoBox = document.createElement('div');
        infoBox.className = 'info-box';

        const sourceTag = document.createElement('div');
        sourceTag.className = 'source-label';
        sourceTag.innerText = `Source: ${item.source}`;

        const apiLink = document.createElement('a');
        apiLink.className = 'api-link';
        apiLink.href = item.url;
        apiLink.target = '_blank';
        apiLink.rel = 'noopener noreferrer';
        apiLink.title = item.url;
        apiLink.innerText = item.url;

        infoBox.appendChild(sourceTag);
        infoBox.appendChild(apiLink);

        img.onload = () => {
          card.appendChild(img);
          card.appendChild(infoBox);
          gallery.appendChild(card);
          loadedCount++;
        };

        img.onerror = () => {
          card.remove();
          if (gallery.children.length === 0 && loadedCount === 0) {
            status.innerText = `No images found for "${rawInput}". Check spelling.`;
          }
        };
      });
    }

    searchBtn.addEventListener('click', fetchAllImages);
    characterInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') fetchAllImages();
    });

    window.addEventListener('DOMContentLoaded', fetchAllImages);
  </script>
</body>
</html>
