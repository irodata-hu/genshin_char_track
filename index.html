<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Character Profile & Extractor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121218;
      color: #e0e0e0;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 1.5rem;
      justify-content: center;
    }

    input, button {
      padding: 0.8rem 1rem;
      font-size: 1rem;
      border-radius: 6px;
      border: none;
    }

    input {
      width: 250px;
      background-color: #2a2a36;
      color: #fff;
    }

    button {
      background-color: #4c6ef5;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #3b5bdb;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: #1e1e28;
      border-radius: 10px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      display: none;
    }

    .card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      object-position: top;
      border-radius: 8px;
      margin-bottom: 1rem;
      background-color: #0d0d12;
    }

    .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      background-color: #333345;
      font-size: 0.85rem;
      margin: 0.2rem;
    }

    .debug-panel {
      background-color: #181822;
      border-radius: 10px;
      padding: 1rem;
      border: 1px solid #333345;
      font-family: monospace;
      font-size: 0.85rem;
      overflow: hidden;
    }

    .debug-title {
      color: #ffd43b;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .status-box {
      padding: 0.5rem;
      border-radius: 4px;
      background: #282836;
      margin-bottom: 1rem;
      color: #74c0fc;
      word-break: break-all;
    }

    pre {
      background-color: #0d0d12;
      padding: 0.8rem;
      border-radius: 6px;
      max-height: 250px;
      overflow-y: auto;
      color: #a6e22e;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .extraction-steps {
      color: #b197fc;
      margin-bottom: 1rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 style="text-align: center; margin-bottom: 1rem;">Genshin Character Extractor (GitHub Pages Ready)</h1>

    <div class="search-box">
      <input type="text" id="characterInput" placeholder="e.g. furina, raiden, hutao" value="furina">
      <button id="searchBtn">Search</button>
    </div>

    <div class="main-layout">
      <!-- Profile UI Card -->
      <div class="card" id="profileCard">
        <img id="charImage" src="" alt="Character Image">
        <h2 id="charName" style="margin: 0.5rem 0;"></h2>
        <div>
          <span class="badge" id="charRarity"></span>
          <span class="badge" id="charElement"></span>
          <span class="badge" id="charWeapon"></span>
        </div>
      </div>

      <!-- Debug & Extraction Logic Panel -->
      <div class="debug-panel">
        <div class="debug-title">🔍 API Request Status</div>
        <div class="status-box" id="statusBox">Ready to fetch data.</div>

        <div class="debug-title">⚙️ Data Extraction Logic</div>
        <div class="extraction-steps" id="extractionSteps">Waiting for query...</div>

        <div class="debug-title">📦 Raw JSON Response</div>
        <pre id="jsonOutput">// Raw JSON response will appear here</pre>
      </div>
    </div>
  </div>

  <script>
    const statusBox = document.getElementById('statusBox');
    const searchBtn = document.getElementById('searchBtn');
    const extractionSteps = document.getElementById('extractionSteps');
    const jsonOutput = document.getElementById('jsonOutput');
    const card = document.getElementById('profileCard');
    const charImage = document.getElementById('charImage');

    async function searchCharacter() {
      const rawInput = document.getElementById('characterInput').value.trim() || 'furina';
      const charId = rawInput.toLowerCase().replace(/\s+/g, '-');
      const apiUrl = `https://genshin.jmp.blue/characters/${charId}`;

      statusBox.style.color = '#74c0fc';
      statusBox.innerText = `Fetching GET ${apiUrl}...`;

      try {
        const response = await fetch(apiUrl);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: Character "${charId}" not found.`);
        }

        const data = await response.json();

        // Target high-reliability image endpoints
        const primaryImage = `https://genshin.jmp.blue/characters/${charId}/gacha-card`;
        const fallbackImage = `https://genshin.jmp.blue/characters/${charId}/icon`;

        // Handle Image Load Errors gracefully
        charImage.onerror = function() {
          if (this.src !== fallbackImage) {
            console.warn("Primary image blocked or missing. Trying fallback icon...");
            this.src = fallbackImage;
          }
        };

        charImage.src = primaryImage;

        // Print step-by-step extraction logic
        extractionSteps.innerHTML = `
          1. <b>API Endpoint:</b> GET ${apiUrl}<br>
          2. <b>Name Field:</b> data.name ➔ "${data.name}"<br>
          3. <b>Rarity Field:</b> data.rarity ➔ ${data.rarity}<br>
          4. <b>Element & Weapon:</b> data.vision / data.weapon ➔ ${data.vision} / ${data.weapon}<br>
          5. <b>Primary Image URL:</b> ${primaryImage}<br>
          6. <b>Fallback Icon URL:</b> ${fallbackImage}
        `;

        // Output Raw Data
        jsonOutput.innerText = JSON.stringify(data, null, 2);

        // Update UI Text
        document.getElementById('charName').innerText = data.name;
        document.getElementById('charRarity').innerText = '★'.repeat(parseInt(data.rarity) || 5);
        document.getElementById('charElement').innerText = data.vision || data.element || 'N/A';
        document.getElementById('charWeapon').innerText = data.weapon || 'N/A';

        card.style.display = 'block';
        statusBox.style.color = '#51cf66';
        statusBox.innerText = `✅ Loaded ${data.name} on GitHub Pages!`;

      } catch (err) {
        statusBox.style.color = '#ff6b6b';
        statusBox.innerText = `❌ ${err.message}`;
        extractionSteps.innerText = 'Extraction failed.';
        jsonOutput.innerText = `{\n  "error": "${err.message}"\n}`;
        card.style.display = 'none';
      }
    }

    searchBtn.addEventListener('click', searchCharacter);
    document.getElementById('characterInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchCharacter();
    });

    window.addEventListener('DOMContentLoaded', searchCharacter);
  </script>
</body>
</html>
