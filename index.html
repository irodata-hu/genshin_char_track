<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Character Image Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121218;
      color: #e0e0e0;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
    }

    input, button {
      padding: 0.8rem 1rem;
      font-size: 1rem;
      border-radius: 6px;
      border: none;
    }

    input {
      width: 250px;
      background-color: #2a2a36;
      color: #fff;
    }

    button {
      background-color: #4c6ef5;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #3b5bdb;
    }

    #status {
      margin-bottom: 1rem;
      color: #ff6b6b;
      font-weight: bold;
    }

    .image-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 1200px;
    }

    .img-wrapper {
      background-color: #1e1e28;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Fixed: object-fit contain prevents cropping */
    .img-wrapper img {
      max-width: 100%;
      max-height: 75vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="search-box">
    <input type="text" id="characterInput" placeholder="Enter name (e.g. furina, raiden)" value="furina">
    <button id="searchBtn">Search</button>
  </div>

  <div id="status"></div>

  <div class="image-grid" id="imageGrid"></div>

  <script>
    const searchBtn = document.getElementById('searchBtn');
    const imageGrid = document.getElementById('imageGrid');
    const statusDiv = document.getElementById('status');

    async function fetchImages() {
      const rawInput = document.getElementById('characterInput').value.trim() || 'furina';
      const charId = rawInput.toLowerCase().replace(/\s+/g, '-');
      
      statusDiv.innerText = '';
      imageGrid.innerHTML = '';

      // Image endpoints available for Genshin Impact characters
      const imageEndpoints = [
        `https://genshin.jmp.blue/characters/${charId}/gacha-splash`,
        `https://genshin.jmp.blue/characters/${charId}/gacha-card`,
        `https://genshin.jmp.blue/characters/${charId}/card`,
        `https://genshin.jmp.blue/characters/${charId}/portrait`,
        `https://genshin.jmp.blue/characters/${charId}/icon`
      ];

      let loadedCount = 0;

      imageEndpoints.forEach(url => {
        const wrapper = document.createElement('div');
        wrapper.className = 'img-wrapper';

        const img = document.createElement('img');
        img.src = url;

        img.onload = () => {
          wrapper.appendChild(img);
          imageGrid.appendChild(wrapper);
          loadedCount++;
        };

        // Silently skip endpoints that do not exist for the specified character
        img.onerror = () => {
          if (imageGrid.children.length === 0 && loadedCount === 0) {
            statusDiv.innerText = `No images found for "${charId}". Check spelling.`;
          }
        };
      });
    }

    searchBtn.addEventListener('click', fetchImages);
    document.getElementById('characterInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') fetchImages();
    });

    window.addEventListener('DOMContentLoaded', fetchImages);
  </script>
</body>
</html>
