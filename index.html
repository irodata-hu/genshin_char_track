<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Character High-Res Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0e0e12;
      color: #ffffff;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
    }

    input, button {
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    input {
      width: 280px;
      background-color: #1e1e28;
      color: #fff;
      border: 1px solid #333345;
    }

    button {
      background-color: #4c6ef5;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #3b5bdb;
    }

    #status {
      margin-bottom: 1rem;
      color: #ff6b6b;
      font-weight: bold;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 1400px;
    }

    .img-card {
      background-color: #161620;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Uncropped full resolution aspect ratio */
    .img-card img {
      max-width: 100%;
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="search-box">
    <input type="text" id="characterInput" placeholder="Enter character name (e.g. Furina, Raiden)" value="Furina">
    <button id="searchBtn">Search</button>
  </div>

  <div id="status"></div>

  <div class="gallery" id="gallery"></div>

  <script>
    const searchBtn = document.getElementById('searchBtn');
    const characterInput = document.getElementById('characterInput');
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');

    let nameMap = {};

    // Load character alias mapping on startup for 100% search accuracy
    async function initNameMap() {
      try {
        const res = await fetch('https://fastly.jsdelivr.net/gh/theBowja/genshin-db@main/src/data/namemap/characters.json');
        nameMap = await res.json();
      } catch (e) {
        console.warn('Could not pre-load name map, falling back to direct slug search.');
      }
    }

    // Strips CDN downscaling query params to force original full resolution
    function cleanHighResUrl(url) {
      if (!url || typeof url !== 'string') return null;
      return url.replace(/\/revision\/latest\/scale-to-width-down\/\d+/, '/revision/latest');
    }

    async function loadFullResImages() {
      const rawInput = characterInput.value.trim();
      if (!rawInput) return;

      const sanitizedKey = rawInput.toLowerCase().replace(/[^a-z0-9]/g, '');
      const targetFile = nameMap[sanitizedKey] || sanitizedKey;

      status.innerText = '';
      gallery.innerHTML = '';

      try {
        const res = await fetch(`https://fastly.jsdelivr.net/gh/theBowja/genshin-db@main/src/data/english/characters/${targetFile}.json`);
        
        if (!res.ok) {
          status.innerText = `Character "${rawInput}" not found. Check spelling.`;
          return;
        }

        const data = await res.json();
        const imgObj = data.images || {};

        // Extract and sanitize image URLs
        const rawUrls = [
          imgObj.cover1,
          imgObj.cover2,
          imgObj.icon,
          imgObj.sideicon,
          imgObj['hoyolab-avatar']
        ];

        const cleanUrls = rawUrls
          .map(cleanHighResUrl)
          .filter((url, idx, self) => url && self.indexOf(url) === idx);

        if (cleanUrls.length === 0) {
          status.innerText = 'No images available for this character.';
          return;
        }

        cleanUrls.forEach(url => {
          const card = document.createElement('div');
          card.className = 'img-card';

          const img = document.createElement('img');
          // Bypass GitHub Pages CDN hotlink blocks
          img.setAttribute('referrerpolicy', 'no-referrer');
          img.src = url;
          img.alt = data.name || 'Genshin Image';

          img.onload = () => {
            card.appendChild(img);
            gallery.appendChild(card);
          };
        });

      } catch (err) {
        status.innerText = `Error loading images. Check your network or try another character.`;
      }
    }

    searchBtn.addEventListener('click', loadFullResImages);
    characterInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadFullResImages();
    });

    window.addEventListener('DOMContentLoaded', async () => {
      await initNameMap();
      loadFullResImages();
    });
  </script>
</body>
</html>
