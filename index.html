<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Source Genshin Character Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0e0e12;
      color: #ffffff;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
    }

    input, button {
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    input {
      width: 280px;
      background-color: #1e1e28;
      color: #fff;
      border: 1px solid #333345;
    }

    button {
      background-color: #4c6ef5;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #3b5bdb;
    }

    #status {
      margin-bottom: 1rem;
      color: #ff6b6b;
      font-weight: bold;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 1400px;
    }

    .img-card {
      background-color: #161620;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      /* Ensures card grows to full aspect ratio of image */
      max-width: 100%;
    }

    /* Fixed: Preserves exact original dimensions and prevents clipping */
    .img-card img {
      max-width: 100%;
      max-height: 80vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      display: block;
    }

    .source-label {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #a0a0b0;
      background-color: #0e0e12;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #2a2a3a;
      text-align: center;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="search-box">
    <input type="text" id="characterInput" placeholder="e.g. furina, raiden, hutao" value="furina">
    <button id="searchBtn">Search</button>
  </div>

  <div id="status"></div>
  <div class="gallery" id="gallery"></div>

  <script>
    const searchBtn = document.getElementById('searchBtn');
    const characterInput = document.getElementById('characterInput');
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');

    function getSlug(input) {
      const clean = input.toLowerCase().trim();
      const aliases = {
        'furina': 'furina',
        'raiden': 'raiden',
        'raiden shogun': 'raiden',
        'hu tao': 'hu-tao',
        'hutao': 'hu-tao',
        'yae': 'yae-miko',
        'yae miko': 'yae-miko',
        'ayaka': 'ayaka',
        'kamisato ayaka': 'ayaka',
        'ayato': 'ayato',
        'kamisato ayato': 'ayato',
        'kazuha': 'kazuha',
        'kaedehara kazuha': 'kazuha',
        'yelan': 'yelan',
        'zhongli': 'zhongli',
        'nahida': 'nahida',
        'neuvillette': 'neuvillette',
        'alhaitham': 'alhaitham',
        'navia': 'navia',
        'arlecchino': 'arlecchino'
      };
      return aliases[clean] || clean.replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
    }

    async function loadMultiSourceImages() {
      const rawInput = characterInput.value.trim() || 'furina';
      const slug = getSlug(rawInput);

      status.innerText = '';
      gallery.innerHTML = '';

      let imageSources = [];

      // API Source 1: genshin.jmp.blue
      const jmpEndpoints = [
        { url: `https://genshin.jmp.blue/characters/${slug}/gacha-splash`, source: 'genshin.jmp.blue (Gacha Splash)' },
        { url: `https://genshin.jmp.blue/characters/${slug}/gacha-card`, source: 'genshin.jmp.blue (Gacha Card)' },
        { url: `https://genshin.jmp.blue/characters/${slug}/portrait`, source: 'genshin.jmp.blue (Portrait)' },
        { url: `https://genshin.jmp.blue/characters/${slug}/card`, source: 'genshin.jmp.blue (Card)' }
      ];
      imageSources.push(...jmpEndpoints);

      // API Source 2: genshin-db Repository CDN
      try {
        const res = await fetch(`https://fastly.jsdelivr.net/gh/theBowja/genshin-db@main/src/data/english/characters/${slug}.json`);
        if (res.ok) {
          const dbData = await res.json();
          const imgObj = dbData.images || {};

          const dbUrls = [
            { raw: imgObj.cover1, name: 'genshin-db CDN (Cover Art 1)' },
            { raw: imgObj.cover2, name: 'genshin-db CDN (Cover Art 2)' },
            { raw: imgObj.icon, name: 'genshin-db CDN (Icon)' },
            { raw: imgObj['hoyolab-avatar'], name: 'genshin-db CDN (HoYoLab)' }
          ];

          dbUrls.forEach(item => {
            if (item.raw) {
              const cleanUrl = item.raw.replace(/\/revision\/latest\/scale-to-width-down\/\d+/, '/revision/latest');
              imageSources.push({ url: cleanUrl, source: item.name });
            }
          });
        }
      } catch (err) {
        console.warn('genshin-db fetch skipped:', err);
      }

      let loadedCount = 0;

      imageSources.forEach(item => {
        const card = document.createElement('div');
        card.className = 'img-card';

        const img = document.createElement('img');
        img.setAttribute('referrerpolicy', 'no-referrer');
        img.src = item.url;
        img.alt = rawInput;

        const sourceTag = document.createElement('div');
        sourceTag.className = 'source-label';
        sourceTag.innerText = `Source: ${item.source}`;

        img.onload = () => {
          card.appendChild(img);
          card.appendChild(sourceTag);
          gallery.appendChild(card);
          loadedCount++;
        };

        img.onerror = () => {
          card.remove();
          if (gallery.children.length === 0 && loadedCount === 0) {
            status.innerText = `No images found for "${rawInput}". Check spelling.`;
          }
        };
      });
    }

    searchBtn.addEventListener('click', loadMultiSourceImages);
    characterInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadMultiSourceImages();
    });

    window.addEventListener('DOMContentLoaded', loadMultiSourceImages);
  </script>
</body>
</html>
